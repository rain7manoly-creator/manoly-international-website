# Every push to main is built and put live on Fly.io (app "manoly-warehouse").
# Needs one GitHub secret: FLY_API_TOKEN — a deploy token from the Fly.io dashboard.
# Database changes run by themselves when the new version starts.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button on the Actions tab

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
